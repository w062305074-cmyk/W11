<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毛小孩の家 - 寵物美容工作室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #f7a072;
      --primary-dark: #e07a4b;
      --bg-cream: #fbf7f4;
      --card-bg: #ffffff;
      --text-main: #3d3a39;
      --text-muted: #6b6360;
      --tag-bg: #faeedb;
      --tag-text: #a8622c;
      --border-radius: 18px;
      --shadow: 0 10px 25px rgba(180, 140, 120, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.7;
      padding: 20px 16px 60px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* 頂部 Header & 介紹 */
    header {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 36px 28px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
      border-top: 6px solid var(--primary-color);
    }

    .badge {
      display: inline-block;
      background-color: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .about-intro {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 650px;
      margin: 0 auto 24px;
      line-height: 1.8;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .feature-item {
      background: #fdf2e9;
      color: #9c5221;
      padding: 6px 16px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .contact-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      padding-top: 20px;
      border-top: 1px dashed #e8ded8;
    }

    .info-card {
      background: #faf6f3;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.98rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-card strong {
      color: var(--primary-dark);
    }

    .info-card a {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
    }
    
    .info-card a:hover {
      text-decoration: underline;
    }

    /* 區塊標題 */
    .section-title {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 22px;
      background: var(--primary-color);
      border-radius: 4px;
    }

    /* 中間區域：價目表與作品照 (兩欄排版，手機自動切換單欄) */
    .middle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .img-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #f5f0eb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .img-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .img-wrapper:hover img {
      transform: scale(1.02);
    }

    /* 衛教卡區塊 */
    .care-section {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .care-img-wrapper {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
    }

    .care-img-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 頁尾 */
    footer {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* 響應式優化 */
    @media (max-width: 640px) {
      body {
        padding: 12px 10px 40px;
      }

      h1 {
        font-size: 1.8rem;
      }

      header {
        padding: 24px 16px;
      }

      .card, .care-section {
        padding: 18px 14px;
      }

      .contact-info {
        flex-direction: column;
        gap: 10px;
      }

      .info-card {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 最上面：店名、介紹、營業時間、預約電話 -->
    <header>
      <div class="badge">🐾 寵物美容工作室</div>
      <h1>毛小孩の家</h1>
      <p class="about-intro">
        我們是一間開在住宅區的小型寵物美容工作室，一次只接一隻，不關籠、不趕時間。<br>
        怕生、年紀大、第一次美容的毛孩，都可以慢慢來。
      </p>

      <div class="features">
        <div class="feature-item">🐶 服務對象：小型犬、中大型犬、貓</div>
        <div class="feature-item">✨ 一對一美容服務</div>
        <div class="feature-item">📷 過程拍照回報給家長</div>
      </div>

      <div class="contact-info">
        <div class="info-card">
          <span>🕒 <strong>營業時間：</strong>週二到週日 10:00–19:00（週一公休）</span>
        </div>
        <div class="info-card">
          <span>📞 <strong>預約電話：</strong><a href="tel:0900000000">0900-000-000</a></span>
        </div>
        <div class="info-card">
          <span>💬 <strong>官方 LINE：</strong>@maoxiaohai</span>
        </div>
      </div>
    </header>

    <!-- 2. 中間：價目表和作品照 -->
    <main class="middle-grid">
      <section class="card">
        <h2 class="section-title">服務價目表</h2>
        <div class="img-wrapper">
          <img src="price.png" alt="毛小孩の家 - 服務價目表" loading="lazy">
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">美容作品照</h2>
        <div class="img-wrapper">
          <img src="photo.png" alt="毛小孩の家 - 美容作品照" loading="lazy">
        </div>
      </section>
    </main>

    <!-- 3. 下面：衛教卡，標題「美容後照護」 -->
    <section class="care-section">
      <h2 class="section-title">美容後照護</h2>
      <div class="care-img-wrapper">
        <img src="care.png" alt="毛小孩の家 - 美容後照護衛教卡" loading="lazy">
      </div>
    </section>

    <footer>
      <p>© 毛小孩の家 寵物美容工作室 ｜ 虛構店家・課堂練習用</p>
    </footer>
  </div>

</body>
</html>
